# 本地配置模板：复制成 application-local.yaml 后填入真实密码
# application-local.yaml 已在 .gitignore 中，不会被提交
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/liteblog?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 你的MySQL密码
    hikari:
      pool-name: LiteBlogHikari
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
      # 连接有效性检测，避免拿到已断开的连接
      validation-timeout: 1000

jwt:
  # HMAC-SHA256 签名密钥：至少 32 字节的随机字符串，泄露等于任何人可以伪造登录态
  secret: 改成一段至少32字节的随机字符串作为JWT签名密钥
